name: Cinema City watchdog

# Normal schedule:
#   Every 10 minutes, at :03, :13, :23, :33, :43 and :53.
#
# Likely Cinema City release window:
#   Monday 18:00 through Tuesday 09:59, Europe/Prague time.
#   An additional interleaved schedule runs at :08, :18, :28, :38, :48 and :58,
#   producing one check every 5 minutes during that window.

on:
  schedule:
    # Baseline: every 10 minutes, every day.
    - cron: "3/10 * * * *"
      timezone: "Europe/Prague"

    # Extra checks on Monday evening.
    - cron: "8/10 18-23 * * 1"
      timezone: "Europe/Prague"

    # Extra checks on Tuesday morning.
    - cron: "8/10 0-9 * * 2"
      timezone: "Europe/Prague"

  # Allows manual runs from the GitHub Actions page.
  workflow_dispatch:
    inputs:
      force_report:
        description: "Report all current screenings, including known ones"
        type: boolean
        required: false
        default: false

# The workflow commits state/seen.json back to the repository.
# Prevent two runs from modifying that file simultaneously.
concurrency:
  group: cinema-city-watchdog
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check-screenings:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Cinema City schedule
        id: watchdog
        shell: bash
        env:
          FILM_PATTERN: odyss
          AUDITORIUM_PATTERN: imax
        run: |
          set -euo pipefail

          extra_args=()

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] \
            && [[ "${{ inputs.force_report }}" == "true" ]]; then
            extra_args+=("--force-report")
          fi

          python3 watch.py \
            --state state/seen.json \
            --report report.md \
            --title title.txt \
            "${extra_args[@]}"

      - name: Create notification issue
        if: steps.watchdog.outputs.has_news == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          issue_url="$(
            gh issue create \
              --title "$(cat title.txt)" \
              --body-file report.md \
              --assignee "${{ github.repository_owner }}"
          )"

          echo "Created notification issue: ${issue_url}"

          # The issue is only used to trigger the GitHub notification.
          gh issue close "${issue_url}" --reason completed

      - name: Save updated screening state
        shell: bash
        run: |
          set -euo pipefail

          rm -f report.md title.txt

          if git diff --quiet -- state/seen.json; then
            echo "Screening state did not change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/seen.json
          git commit -m \
            "Update Cinema City state ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          # Retry in case another run updated the branch immediately before us.
          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin "${GITHUB_REF_NAME}" \
              && git push; then
              echo "State successfully saved."
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying."
            sleep 5
          done

          echo "::error::Could not push the updated screening state."
          exit 1
